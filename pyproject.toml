[project]
name = "l20-pretrain"
version = "0.1.0"
description = "Single-GPU Llama-style pretraining lab tuned for an NVIDIA L20 48GB GPU."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "datasets>=2.19",
  "boto3>=1.34",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "safetensors>=0.4",
  "tokenizers>=0.19",
  "torch>=2.3",
  "tqdm>=4.66",
  "transformers>=4.45,<5",
]

[project.optional-dependencies]
speed = [
  "liger-kernel>=0.5",
]
eval = [
  "lm-eval>=0.4.4",
]
rlvr = [
  "accelerate>=0.34",
  "trl>=0.17",
]

[project.scripts]
l20-pretrain = "l20_pretrain.train:main"
l20-generate = "l20_pretrain.generate:main"
l20-eval-ppl = "l20_pretrain.eval_ppl:main"
l20-sft = "l20_pretrain.train_sft:main"
l20-prepare-shards = "l20_pretrain.prepare_shards:main"
l20-prepare-mixture-shards = "l20_pretrain.prepare_mixture_shards:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

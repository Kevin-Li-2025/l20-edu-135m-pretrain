run_name: l20-stage6-edu-reasoning-300m-tensor-profile
output_dir: runs/l20-stage6-edu-reasoning-300m-tensor-profile
seed: 20260627
tokenizer_name: models/l20-edu-135m
init_model_name_or_path: runs/l20-stage6-edu-reasoning-300m/final

dataset:
  tokenized_path: data/l20_stage6_edu_reasoning_300m
  split: train
  text_column: text
  append_eos: true

model:
  block_size: 4096
  hidden_size: 576
  intermediate_size: 1536
  num_hidden_layers: 30
  num_attention_heads: 9
  num_key_value_heads: 3
  rope_theta: 10000.0
  rms_norm_eps: 0.000001
  attention_dropout: 0.0
  tie_word_embeddings: true
  vocab_multiple: 64
  attn_implementation: sdpa

trainer:
  micro_batch_size: 6
  gradient_accumulation_steps: 4
  max_steps: 8
  warmup_steps: 1
  learning_rate: 0.0000005
  min_lr_ratio: 1.0
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  dtype: bfloat16
  compile: false
  liger_kernel: true
  gradient_checkpointing: false
  log_interval: 1
  eval_interval: 0
  eval_batches: 0
  save_interval: 0
  keep_last_checkpoints: 1
  num_workers: 0
  mfu_peak_tflops: 119.5

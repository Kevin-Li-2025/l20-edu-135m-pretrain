run_name: l20-edu-135m-stage3-ultra-clean-dclm-fwe-replay-8k
output_dir: runs/l20-edu-135m-stage3-dclm-edu-replay-8k
seed: 20260611
tokenizer_name: AliceYin/l20-edu-135m
init_model_name_or_path: runs/l20-edu-135m-stage2-replay-polish-8k/final

dataset:
  tokenized_path: data/l20_stage3_dclm_edu_replay_8k
  split: train
  text_column: text
  append_eos: true

model:
  block_size: 8192
  hidden_size: 576
  intermediate_size: 1536
  num_hidden_layers: 30
  num_attention_heads: 9
  num_key_value_heads: 3
  rope_theta: 10000.0
  rms_norm_eps: 0.000001
  attention_dropout: 0.0
  tie_word_embeddings: true
  vocab_multiple: 64
  attn_implementation: sdpa
  rope_scaling:
    rope_type: yarn
    factor: 4.0
    original_max_position_embeddings: 2048

trainer:
  micro_batch_size: 4
  gradient_accumulation_steps: 16
  max_steps: 19074
  warmup_steps: 300
  learning_rate: 0.000004
  min_lr_ratio: 0.15
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  dtype: bfloat16
  compile: false
  compile_mode: null
  compile_fullgraph: null
  liger_kernel: true
  gradient_checkpointing: false
  log_interval: 1
  eval_interval: 250
  eval_batches: 16
  save_interval: 500
  keep_last_checkpoints: 4
  num_workers: 0
  mfu_peak_tflops: 119.5

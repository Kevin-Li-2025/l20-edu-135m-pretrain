name: l20-stage2-ultra-math-code-textbook-replay
output_dir: data/l20_stage2_math_code_textbook_replay_8k
tokenizer: AliceYin/l20-edu-135m
target_tokens: 1000000000
val_tokens: 4194304
block_size: 8192
report_interval: 1000

# Ultra Stage-2 mixture for the 135M continued-pretraining checkpoint.
# The recipe follows the public small-model SOTA pattern:
# deduplicated educational web as the backbone, replay to prevent drift,
# math/code capability injectors, and a small synthetic textbook tail.
sources:
  - name: edu-hq-replay
    family: edu_replay
    kind: tokenized_replay
    tokenized_path: data/l20_edu_hq_8k
    tokenized_split: train
    weight: 0.20
    sample_seed: 20260610

  - name: smollm-fineweb-edu-dedup-4plus
    family: edu_web
    kind: hf_text
    dataset: HuggingFaceTB/smollm-corpus
    config_name: fineweb-edu-dedup
    split: train
    text_column: text
    weight: 0.35
    min_chars: 700
    max_chars: 45000
    min_score: 4.0
    min_int_score: 4
    quality:
      min_alpha_ratio: 0.48
      max_digit_ratio: 0.28
      min_unique_word_ratio: 0.18
      max_repeated_ngram_fraction: 0.16

  - name: finemath-4plus
    family: math
    kind: hf_text
    dataset: HuggingFaceTB/finemath
    config_name: finemath-4plus
    split: train
    text_column: text
    weight: 0.20
    min_chars: 500
    max_chars: 45000
    min_score: 4.0
    min_int_score: 4
    quality:
      min_alpha_ratio: 0.25
      max_digit_ratio: 0.45
      min_unique_word_ratio: 0.08
      max_repeated_ngram_fraction: 0.22

  - name: stack-edu-python
    family: code
    kind: stack_edu
    dataset: HuggingFaceTB/stack-edu
    config_name: Python
    split: train
    text_column: text
    weight: 0.08
    min_chars: 250
    max_chars: 60000
    min_score: 3.5
    min_int_score: 4
    require_license_type: permissive
    include_metadata_header: true

  - name: stack-edu-javascript
    family: code
    kind: stack_edu
    dataset: HuggingFaceTB/stack-edu
    config_name: JavaScript
    split: train
    text_column: text
    weight: 0.035

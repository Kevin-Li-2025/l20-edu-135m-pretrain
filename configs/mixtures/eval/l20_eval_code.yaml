name: l20-eval-code
output_dir: data/l20_eval_code_8k
tokenizer: AliceYin/l20-edu-135m
target_tokens: 8192
val_tokens: 524288
block_size: 8192
report_interval: 1000

sources:
  - name: stack-edu-python
    family: code
    kind: stack_edu
    dataset: HuggingFaceTB/stack-edu
    config_name: Python
    split: train
    text_column: text
    weight: 0.35
    min_chars: 250
    max_chars: 60000
    min_score: 3.5
    min_int_score: 4
    require_license_type: permissive
    include_metadata_header: true


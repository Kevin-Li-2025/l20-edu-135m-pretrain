name: smollm2-hq-anneal-100m
output_dir: /tmp/smollm2_hq_anneal_100m
tokenizer: HuggingFaceTB/SmolLM2-135M
target_tokens: 100000000
val_tokens: 1048576
block_size: 2048
report_interval: 250

data_guard:
  enabled: true
  index_path: /tmp/smollm2_hq_anneal_100m/cross_source_guard.sqlite
  similarity_threshold: 0.82
  max_duplicate_segment_fraction: 0.30
  contamination_path: /tmp/l20_benchmark_contamination/eval_6tasks.jsonl
  contamination_ngram: 13
  contamination_lcs_threshold: 0.60

sources:
  - name: dclm-edu-3plus
    family: edu_web
    kind: hf_text
    dataset: HuggingFaceTB/dclm-edu
    repo_files:
      - data/001_00008.parquet
    cache_files_locally: true
    text_column: text
    weight: 0.40
    min_chars: 700
    max_chars: 45000
    min_score: 3.0
    min_int_score: 3
    unique_tokens_estimate: 3800000000000
    quality:
      min_alpha_ratio: 0.48
      max_digit_ratio: 0.28
      min_unique_word_ratio: 0.18
      max_repeated_ngram_fraction: 0.16

  - name: fineweb-edu-dedup-4plus
    family: edu_web
    kind: hf_text
    dataset: HuggingFaceTB/smollm-corpus
    repo_files:
      - fineweb-edu-dedup/train-00008-of-00234.parquet
    cache_files_locally: true
    text_column: text
    weight: 0.30
    min_chars: 700
    max_chars: 45000
    min_score: 4.0
    min_int_score: 4
    unique_tokens_estimate: 220000000000
    quality:

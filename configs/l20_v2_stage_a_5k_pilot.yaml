run_name: l20-v2-stage-a-5k-pilot
output_dir: runs/l20-v2-stage-a-5k-pilot
seed: 20260626
tokenizer_name: models/l20-edu-135m
init_model_name_or_path: models/l20-edu-135m

dataset:
  tokenized_path: data/l20_v2_stage_a_targeted_5k_pilot
  split: train
  text_column: text
  append_eos: true

model:
  block_size: 5120
  hidden_size: 576
  intermediate_size: 1536
  num_hidden_layers: 30
  num_attention_heads: 9
  num_key_value_heads: 3
  rope_theta: 10000.0
  rms_norm_eps: 0.000001
  attention_dropout: 0.0
  tie_word_embeddings: true
  vocab_multiple: 64
  attn_implementation: sdpa

trainer:
  micro_batch_size: 5
  gradient_accumulation_steps: 4
  max_steps: 488
  warmup_steps: 25
  learning_rate: 0.000003
  min_lr_ratio: 0.20
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  dtype: bfloat16
  compile: false
  liger_kernel: true
  gradient_checkpointing: false
  log_interval: 10
  eval_interval: 100
  eval_batches: 16
  save_interval: 100
  keep_last_checkpoints: 3
  num_workers: 0
  mfu_peak_tflops: 119.5

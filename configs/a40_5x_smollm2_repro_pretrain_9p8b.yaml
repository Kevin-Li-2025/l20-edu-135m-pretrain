run_name: a40-5x-smollm2-repro-pretrain-9p8b
output_dir: /workspace/a40-pretrain/runs/a40-5x-smollm2-repro-pretrain-9p8b
seed: 8
tokenizer_name: HuggingFaceTB/SmolLM2-135M

dataset:
  tokenized_path: /tmp/smollm2-135m-10b-tokenized
  split: train
  append_eos: true

# Exact SmolLM2-135M architecture from the released Nanotron checkpoint.
model:
  block_size: 2048
  hidden_size: 576
  intermediate_size: 1536
  num_hidden_layers: 30
  num_attention_heads: 9
  num_key_value_heads: 3
  rope_theta: 10000.0
  rms_norm_eps: 0.00001
  attention_dropout: 0.0
  initializer_range: 0.041666666666666664
  scale_residual_projections: true
  tie_word_embeddings: true
  vocab_multiple: 1
  attn_implementation: sdpa

trainer:
  # 5 GPUs * 24 sequences * 4 accumulation * 2048 = 983,040 tokens/update,
  # within 6.25% of the official 1,048,576-token global batch.
  micro_batch_size: 24
  gradient_accumulation_steps: 4
  # 9,969 * 983,040 = 9,799,925,760 unique train tokens.
  max_steps: 9969
  warmup_steps: 200
  learning_rate: 0.003
  min_lr_ratio: 0.0
  lr_scheduler_type: wsd
  lr_decay_starting_step: 7975
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  dtype: bfloat16
  parameter_dtype: float32
  compile: false
  liger_kernel: true
  liger_profile: full
  gradient_checkpointing: false
  log_interval: 5
  eval_interval: 250
  eval_batches: 16
  save_interval: 500
  keep_last_checkpoints: 20
  # Local memmap is faster than GPU consumption; zero workers makes resumed
  # block offsets exact instead of relying on DataLoader prefetch state.
  num_workers: 0
  mfu_peak_tflops: 149.7

run_name: l20-edu-140m-wide-fineweb-1b
output_dir: runs/l20-edu-140m-wide-fineweb-1b
seed: 20260906
tokenizer_name: assets/tokenizer-smollm2-135m

dataset:
  tokenized_path: data/v2_fineweb_1b
  split: train
  streaming: false
  require_manifest: true
  allow_repetition: false

model:
  block_size: 2048
  hidden_size: 768
  intermediate_size: 3072
  num_hidden_layers: 12
  num_attention_heads: 12
  num_key_value_heads: 4
  rope_theta: 10000.0
  rms_norm_eps: 0.000001
  attention_dropout: 0.0
  tie_word_embeddings: true
  vocab_multiple: 64
  attn_implementation: sdpa

trainer:
  micro_batch_size: 6
  gradient_accumulation_steps: 13
  max_steps: 6260
  warmup_steps: 626
  learning_rate: 0.0004
  min_lr_ratio: 0.1
  lr_schedule: cosine
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  dtype: bfloat16
  compile: false
  gradient_checkpointing: false
  log_interval: 50
  eval_interval: 6260
  eval_batches: 256
  save_interval: 1000
  keep_last_checkpoints: 2
  num_workers: 0
  mfu_peak_tflops: 82.58

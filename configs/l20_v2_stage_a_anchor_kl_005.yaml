  grad_clip: 1.0
  dtype: bfloat16
  compile: false
  liger_kernel: false
  gradient_checkpointing: false
  log_interval: 4
  eval_interval: 32
  eval_batches: 32
  save_interval: 64
  keep_last_checkpoints: 1
  num_workers: 0
  mfu_peak_tflops: 119.5

run_name: l20-edu-135m-gpu-smoke-resume
output_dir: runs/l20-edu-135m-gpu-smoke-resume
seed: 20260906
tokenizer_name: assets/tokenizer-smollm2-135m

dataset:
  tokenized_path: data/v2_smoke_shards
  split: train
  streaming: false
  require_manifest: true

model:
  block_size: 2048
  hidden_size: 576
  intermediate_size: 1536
  num_hidden_layers: 30
  num_attention_heads: 9
  num_key_value_heads: 3
  rope_theta: 10000.0
  rms_norm_eps: 0.000001
  attention_dropout: 0.0
  tie_word_embeddings: true
  vocab_multiple: 64
  attn_implementation: sdpa

trainer:
  micro_batch_size: 2
  gradient_accumulation_steps: 1
  max_steps: 3
  warmup_steps: 1
  learning_rate: 0.0004
  min_lr_ratio: 0.1
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  dtype: bfloat16
  deterministic: true
  compile: false
  gradient_checkpointing: false
  log_interval: 1
  eval_interval: 1
  eval_batches: 2
  save_interval: 1
  keep_last_checkpoints: 3
  num_workers: 0
  mfu_peak_tflops: 82.58

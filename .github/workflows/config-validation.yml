name: core-validation

on:
  pull_request:
    paths:
      - ".github/workflows/config-validation.yml"
      - "configs/**"
      - "*.yaml"
      - "pyproject.toml"
      - "scripts/check_pretrain_configs.py"
      - "scripts/check_repo_hygiene.py"
      - "src/**"
      - "tests/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/config-validation.yml"
      - "configs/**"
      - "*.yaml"
      - "pyproject.toml"
      - "scripts/check_pretrain_configs.py"
      - "scripts/check_repo_hygiene.py"
      - "src/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install lightweight validation dependencies
        run: python -m pip install "pyyaml>=6.0" "pytest>=8.0"
      - name: Validate every pretraining config
        run: python scripts/check_pretrain_configs.py
      - name: Run configuration regression tests
        run: PYTHONPATH=src python -m pytest -q tests/test_config.py
      - name: Compile validation entry points
        run: python -m py_compile src/l20_pretrain/config.py scripts/check_pretrain_configs.py

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU PyTorch and project test dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -e ".[dev]"
      - name: Run full unit suite
        run: python -m pytest -q
      - name: Check public repository hygiene
        run: python scripts/check_repo_hygiene.py

name: repo-hygiene

on:
  pull_request:
  push:
    branches: [main]

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check public-release hygiene
        run: python scripts/check_repo_hygiene.py
      - name: Check ablation plan
        run: python scripts/check_ablation_plan.py
      - name: Compile lightweight scripts
        run: python -m py_compile scripts/check_repo_hygiene.py scripts/check_ablation_plan.py scripts/audit_l20_mfu_config.py scripts/eval_and_reweight_mixture.py scripts/prepare_skill_targeted_corpus.py scripts/summarize_rlvr_gsm8k_results.py
